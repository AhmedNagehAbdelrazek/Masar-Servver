name: Build and Push Docker Images

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Main Server
        uses: docker/build-push-action@v6
        with:
          context: ./Main Server
          push: true
          tags: |
            ghcr.io/ahmednagehabdelrazek/main-server:latest
            ghcr.io/ahmednagehabdelrazek/main-server:${{ github.sha }}

      - name: Build and Push Audit Server
        uses: docker/build-push-action@v6
        with:
          context: ./audit-server
          push: true
          tags: |
            ghcr.io/ahmednagehabdelrazek/audit-server:latest
            ghcr.io/ahmednagehabdelrazek/audit-server:${{ github.sha }}