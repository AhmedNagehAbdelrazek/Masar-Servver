name: Build, Push and Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Main Server
        uses: docker/build-push-action@v6
        with:
          context: ./Main Server
          push: true
          tags: |
            ghcr.io/ahmednagehabdelrazek/main-server:latest
            ghcr.io/ahmednagehabdelrazek/main-server:${{ github.sha }}

      - name: Build and Push Audit Server
        uses: docker/build-push-action@v6
        with:
          context: ./audit-server
          push: true
          tags: |
            ghcr.io/ahmednagehabdelrazek/audit-server:latest
            ghcr.io/ahmednagehabdelrazek/audit-server:${{ github.sha }}

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            cd /root/Masar-Servver

            echo "Updating repository..."
            git fetch origin
            git reset --hard origin/main

            echo "Pulling application images..."
            docker compose pull main-server audit-collector nginx

            echo "Deploying application..."
            docker compose up -d --no-deps main-server audit-collector nginx

            echo "Waiting for application..."

            for i in $(seq 1 30)
            do
              if curl -kfs https://localhost/api/healthz >/dev/null
              then
                echo "Main application is healthy."
                break
              fi

              echo "Waiting... ($i/30)"
              sleep 5
            done

            if ! curl -kfs https://localhost/api/healthz >/dev/null
            then
              echo "Health check failed."

              echo "Container status:"
              docker compose ps -a

              echo "Main server logs:"
              docker compose logs --tail=100 main-server

              echo "Audit server logs:"
              docker compose logs --tail=100 audit-collector

              echo "Nginx logs:"
              docker compose logs --tail=100 nginx

              exit 1
            fi

            echo "Final container status:"
            docker compose ps

            echo "Deployment successful."