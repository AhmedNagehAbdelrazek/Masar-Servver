name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }} # <--- Changed from password to key
          script: |
            set -e

            cd /root/Masar-Servver

            git pull origin main

            docker compose pull
            docker compose up -d

            echo "Waiting for health..."

            for i in {1..30}
            do
              if curl -f http://localhost:8000/healthz
              then
                echo "Application is healthy"
                break
              fi
              echo "Waiting..."
              sleep 5
            done

            docker image prune -f