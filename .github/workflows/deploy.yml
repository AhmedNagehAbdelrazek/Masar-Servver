name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }} # <--- Changed from password to key
          script: |
            cd /root/Masar-Servver # <--- Make sure this matches your actual repo folder name!
            git pull origin main
            docker compose down
            docker compose up -d --build
            docker system prune -f