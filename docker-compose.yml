services:
  # ── Nginx gateway ──────────────────────────────────────────
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - main-server
      - audit-collector

  # ── Audit stack ──────────────────────────────────────────────
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: audit
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - audit_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7

  audit-collector:
    image: ghcr.io/ahmednagehabdelrazek/audit-server:latest
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://postgres:postgres@db:5432/audit
      REDIS_URL: redis://redis:6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  # ── Main server stack ────────────────────────────────────────
  main-server:
    image: ghcr.io/ahmednagehabdelrazek/main-server:latest
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      NODE_ENV: production
      PORT: 8000
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_NAME: app_db
      DB_HOST: db
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: change-this-to-a-random-secret
      JWT_EXPIRY: 24h
      SALT_ROUNDS: 12
      UPLOAD_PROVIDER: local
      AUDIT_COLLECTOR_URL: http://audit-collector:4000
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - main_uploads:/app/uploads

volumes:
  audit_pgdata:
  main_uploads:
